name: 打包桌面程序 (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python-headless scikit-learn pillow numpy flask

      - name: 打包为 .exe
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name "几何识别工具" `
            --add-data "geometry_app/templates;templates" `
            --hidden-import cv2 `
            --hidden-import sklearn.cluster `
            --hidden-import numpy `
            --hidden-import flask `
            --hidden-import PIL `
            --hidden-import sklearn `
            --hidden-import sklearn.utils `
            --hidden-import sklearn.utils._cython_blas `
            --hidden-import sklearn.neighbors `
            --hidden-import sklearn.cluster._dbscan_inner `
            geometry_app/launcher.py

      - name: 上传 .exe
        uses: actions/upload-artifact@v4
        with:
          name: 几何识别工具-windows-x64
          path: dist/几何识别工具.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python-headless scikit-learn pillow numpy flask

      - name: 打包为 Linux 可执行文件
        run: |
          pyinstaller \
            --onefile \
            --name "geometry-recognizer" \
            --add-data "geometry_app/templates:templates" \
            --hidden-import cv2 \
            --hidden-import sklearn.cluster \
            --hidden-import numpy \
            --hidden-import flask \
            --hidden-import PIL \
            geometry_app/launcher.py

      - name: 上传 Linux 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: geometry-recognizer-linux-x64
          path: dist/geometry-recognizer