name: 编译 GeometryRecognizer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1

jobs:
  # ── Windows 构建 ──
  build-windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2019]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 opencv-python pillow numpy
          pip install pyinstaller
        shell: pwsh

      - name: 验证依赖
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          python -c "import PySide6; print('PySide6 OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import numpy as np; print('NumPy OK')"
        shell: pwsh

      - name: 编译为单目录 EXE（节省内存）
        run: |
          pyinstaller --onedir --windowed --noconfirm --name GeometryRecognizer `
            --add-data "geometry_app;geometry_app" `
            --hidden-import "PIL._tkinter_finder" `
            --hidden-import "geometry_app.recognizer" `
            --hidden-import "geometry_app.logger" `
            --hidden-import "geometry_app.detikzify_backend" `
            --collect-submodules "geometry_app" `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module PIL.ImageShow `
            --exclude-module tkinter `
            --icon NONE `
            gui_app.py
        shell: pwsh

      - name: 打包为 ZIP
        run: |
          Compress-Archive -Path dist/GeometryRecognizer -DestinationPath dist/GeometryRecognizer-Windows-x64.zip
          $size = (Get-Item dist/GeometryRecognizer-Windows-x64.zip).Length / 1MB
          Write-Host "ZIP 大小: $([math]::Round($size, 2)) MB"
        shell: pwsh

      - name: 上传 ZIP 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GeometryRecognizer-Windows-x64
          path: dist/GeometryRecognizer-Windows-x64.zip

  # ── macOS 构建 ──
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 opencv-python pillow numpy
          pip install pyinstaller

      - name: 编译为 macOS APP（单目录模式）
        run: |
          pyinstaller --onedir --windowed --noconfirm --name GeometryRecognizer \
            --add-data "geometry_app:geometry_app" \
            --hidden-import "geometry_app.recognizer" \
            --hidden-import "geometry_app.logger" \
            --hidden-import "geometry_app.detikzify_backend" \
            --collect-submodules "geometry_app" \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module PIL.ImageShow \
            --exclude-module tkinter \
            gui_app.py

      - name: 打包为 ZIP
        run: |
          ditto -c -k --sequesterRsrc dist/GeometryRecognizer dist/GeometryRecognizer-macOS-x64.zip 2>/dev/null || zip -r dist/GeometryRecognizer-macOS-x64.zip dist/GeometryRecognizer

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GeometryRecognizer-macOS-x64
          path: dist/GeometryRecognizer-macOS-x64.zip

  # ── Linux 构建（Ubuntu runner 最充足） ──
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1-mesa-glx
        continue-on-error: true

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 opencv-python pillow numpy
          pip install pyinstaller

      - name: 编译为 Linux 单目录 App
        run: |
          pyinstaller --onedir --windowed --noconfirm --name GeometryRecognizer \
            --add-data "geometry_app:geometry_app" \
            --hidden-import "geometry_app.recognizer" \
            --hidden-import "geometry_app.logger" \
            --hidden-import "geometry_app.detikzify_backend" \
            --collect-submodules "geometry_app" \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module PIL.ImageShow \
            --exclude-module tkinter \
            gui_app.py

      - name: 打包为 tar.gz
        run: |
          cd dist && tar czf GeometryRecognizer-Linux-x64.tar.gz GeometryRecognizer/
          echo "大小: $(du -h GeometryRecognizer-Linux-x64.tar.gz | cut -f1)"

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GeometryRecognizer-Linux-x64
          path: dist/GeometryRecognizer-Linux-x64.tar.gz