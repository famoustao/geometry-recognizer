name: 编译 Windows 安装包

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: 安装系统依赖 (VC++ Redist)
        run: |
          choco install vcredist-all -y --no-progress 2>$null
        shell: pwsh

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 opencv-python pillow numpy
          pip install pyinstaller
        shell: pwsh

      - name: 验证依赖
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          python -c "import PySide6; print('PySide6 OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import numpy as np; print('NumPy OK')"
        shell: pwsh

      - name: 编译为单文件 EXE
        run: |
          pyinstaller --onefile --windowed --name GeometryRecognizer `
            --add-data "geometry_app;geometry_app" `
            --add-data "geometry_recognizer;geometry_recognizer" `
            --hidden-import "PIL._tkinter_finder" `
            --icon NONE `
            gui_app.py
        shell: pwsh

      - name: 验证 EXE 大小
        run: |
          $exe = "dist/GeometryRecognizer.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "EXE 大小: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "EXE 未找到"
            exit 1
          }
        shell: pwsh

      - name: 上传 EXE 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GeometryRecognizer-Windows-x64
          path: dist/GeometryRecognizer.exe

  # 可选：macOS 版本
  build-mac:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6 opencv-python pillow numpy
          pip install pyinstaller

      - name: 编译为 macOS APP
        run: |
          pyinstaller --onefile --windowed --name GeometryRecognizer \
            --add-data "geometry_app:geometry_app" \
            --add-data "geometry_recognizer:geometry_recognizer" \
            gui_app.py

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GeometryRecognizer-macOS-x64
          path: dist/GeometryRecognizer